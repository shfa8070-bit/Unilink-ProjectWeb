<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>UniLink - استعادة كلمة المرور</title>
</head>
<body>

    <header>
        <div>
            <a href="login.html">&lt; العودة</a>
        </div>
        <div>
            <h1>UniLink</h1>
        </div>
    </header>

    <main>
        <section>
            <h2>استعادة كلمة المرور</h2>
            <p>أعد تعيين كلمة المرور عبر بريدك الإلكتروني</p>

            <form action="login.html" method="GET">
                <div>
                    <label for="reset-email">البريد الإلكتروني</label>
                    <input type="email" id="reset-email" placeholder="name@example.com" required>
                </div>

                <div>
                    <button type="submit">استعادة كلمة المرور &larr;</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
