<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>UniLink - تسجيل الدخول</title>
</head>
<body>
    <header>
        <div><a href="index.html" class="arrow-back" title="رجوع">&gt;</a></div>
        <nav><ul>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="universities.html">الجامعات</a></li>
                <li><a href="add-group-form.html">أضف قروب</a></li>
                <li><a href="my-groups.html">القروبات</a></li>
                <li><a href="community.html">المجتمع</a></li>
            </ul></nav>
        <div><h1>UniLink</h1></div>
    </header>

    <main>
        <section class="auth-section">
            <h2>تسجيل الدخول</h2>
            <h3>مرحباً بعودتك</h3>
            <p>سجّل الدخول إلى حسابك لمتابعة القروبات والمواد</p>

            <form onsubmit="loginUser(event)">
                <div>
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
                </div>
                <div>
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <div class="remember-box">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">تذكرني</label>
                    <a href="forgot-password.html">نسيت كلمة المرور؟</a>
                </div>
                <div>
                    <button type="submit" class="btn-submit">تسجيل الدخول</button>
                </div>
            </form>

            <p class="auth-footer">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        function loginUser(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var userObj = resolveUserFromEmail(email);
            setCurrentUser(userObj);
            window.location.href = 'my-groups.html';
        }
    </script>
</body>
</html>
