<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>UniLink - استعادة كلمة المرور</title>
</head>
<body>
    <header>
        <div><a href="login.html" class="arrow-back" title="رجوع">&gt;</a></div>
        <div><h1>UniLink</h1></div>
    </header>
    <main>
        <section class="auth-section">
            <h2>استعادة كلمة المرور</h2>
            <p>أدخلي بريدك الإلكتروني لإرسال رابط إعادة تعيين كلمة المرور</p>
            <form onsubmit="event.preventDefault(); alert('تم إرسال تعليمات الاستعادة إلى بريدك الإلكتروني.'); window.location.href='login.html';">
                <div>
                    <label for="reset-email">البريد الإلكتروني</label>
                    <input type="email" id="reset-email" placeholder="name@example.com" required>
                </div>
                <div>
                    <button type="submit" class="btn-submit">إرسال الرابط</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
