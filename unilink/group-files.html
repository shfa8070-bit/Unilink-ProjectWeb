<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>UniLink - ملفات القروب</title>
</head>
<body>
    <header>
        <div><a href="my-groups.html" class="arrow-back" title="رجوع">&gt;</a></div>
        <nav><ul>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="universities.html">الجامعات</a></li>
                <li><a href="add-group-form.html">أضف قروب</a></li>
                <li><a href="my-groups.html">القروبات</a></li>
                <li><a href="community.html">المجتمع</a></li>
            </ul></nav>
        <div><h1>UniLink</h1></div>
    </header>
    <main>
        <section>
            <h2 id="files-page-title">ملفات المجموعة والمواد</h2>
            <p id="files-page-desc">الملفات والمراجع الدراسية المتاحة لأعضاء المجموعة</p>

            <form onsubmit="addFileToGroup(event)" style="max-width:520px;">
                <div>
                    <label for="course-select">المادة / المقرر</label>
                    <select id="course-select" onchange="onCourseChange(this.value)"></select>
                </div>
                <div>
                    <label for="file-title">عنوان الملف / المرجع</label>
                    <input type="text" id="file-title" placeholder="مثال: ملخص الوحدة الأولى" required>
                </div>
                <div>
                    <label for="file-upload">إرفاق الملف (مطلوب)</label>
                    <input type="file" id="file-upload" required>
                </div>
                <div>
                    <label for="file-note">وصف مختصر</label>
                    <input type="text" id="file-note" placeholder="وصف الملف" required>
                </div>
                <div>
                    <button type="submit" class="btn-submit">إضافة ملف للمجموعة</button>
                </div>
            </form>

            <div id="group-files-grid" class="cards-grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var initialCode = params.get('code') || 'SE 4111';
        var initialTitle = params.get('title') || '';
        var groupKey = initialCode;

        var courseSelect = document.getElementById('course-select');
        var allGroups = getGroups();
        var seenCodes = {};
        allGroups.forEach(function(g) {
            if (g.course_code && !seenCodes[g.course_code]) {
                seenCodes[g.course_code] = true;
                var opt = document.createElement('option');
                opt.value = g.course_code;
                opt.textContent = g.course_code + ' — ' + g.group_name + ' (' + g.university + ')';
                courseSelect.appendChild(opt);
            }
        });
        if (!seenCodes[initialCode]) {
            var extraOpt = document.createElement('option');
            extraOpt.value = initialCode;
            extraOpt.textContent = initialCode + (initialTitle ? ' — ' + initialTitle : '');
            courseSelect.appendChild(extraOpt);
        }
        courseSelect.value = initialCode;

        function onCourseChange(val) {
            groupKey = val;
            document.getElementById('files-page-title').textContent = 'ملفات المادة: ' + val;
            renderGroupFiles();
        }

        function renderGroupFiles() {
            var grid = document.getElementById('group-files-grid');
            var items = getGroupFiles(groupKey);
            if (!items.length) {
                grid.innerHTML = '<div class="empty-data-msg">لايوجد بيانات</div>';
                return;
            }
            grid.innerHTML = '';
            items.forEach(function(it, idx) {
                var art = document.createElement('article');
                var dlName = it.fileName || (it.title + '.txt');
                var attachHtml = '<p><button type="button" class="btn-download-link" id="dl-gf-' + idx + '">تحميل الملف: ' + escapeHtml(dlName) + '</button></p>';
                var authorLine = it.author ? '<p><small>أضافه: ' + escapeHtml(it.author) + '</small></p>' : '';
                art.innerHTML = '<h3>' + escapeHtml(it.title) + '</h3>' +
                    '<p><span class="badge">المقرر: ' + escapeHtml(groupKey) + '</span></p>' +
                    attachHtml +
                    '<p>' + escapeHtml(it.note) + '</p>' +
                    authorLine;
                grid.appendChild(art);
                document.getElementById('dl-gf-' + idx).onclick = function() {
                    downloadGeneratedFile(dlName, it.title, it.note, 'المقرر: ' + groupKey);
                };
            });
        }

        function addFileToGroup(e) {
            e.preventDefault();
            var title = document.getElementById('file-title').value.trim();
            var fileInput = document.getElementById('file-upload');
            var note = document.getElementById('file-note').value.trim();
            var fileName = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : '';
            var curr = getCurrentUser();
            if (!title || !fileName) return;
            addGroupFile(groupKey, {
                title: title,
                fileName: fileName,
                note: note,
                author: (curr && curr.name) ? curr.name : 'شهد'
            });
            document.getElementById('file-title').value = '';
            document.getElementById('file-upload').value = '';
            document.getElementById('file-note').value = '';
            renderGroupFiles();
        }

        if (initialTitle || initialCode) {
            document.getElementById('files-page-title').textContent = 'ملفات ' + (initialTitle ? initialTitle + ' (' + initialCode + ')' : 'المقرر: ' + initialCode);
        }
        renderGroupFiles();
    </script>
</body>
</html>
