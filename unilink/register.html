<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>UniLink - إنشاء حساب</title>
</head>
<body>
    <header>
        <div><a href="index.html" class="arrow-back" title="رجوع">&gt;</a></div>
        <nav><ul>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="universities.html">الجامعات</a></li>
                <li><a href="add-group-form.html">أضف قروب</a></li>
                <li><a href="my-groups.html">القروبات</a></li>
                <li><a href="community.html">المجتمع</a></li>
            </ul></nav>
        <div><h1>UniLink</h1></div>
    </header>

    <main>
        <section class="auth-section">
            <h2>إنشاء حساب</h2>
            <h3>مرحباً بك</h3>
            <p>أنشئ حسابك الخاص لمتابعة آخر تحديثات جامعتك</p>

            <form onsubmit="registerUser(event)">
                <div>
                    <label for="student-name">الاسم الكامل</label>
                    <input type="text" id="student-name" placeholder="أدخل الاسم الكامل" required>
                </div>
                <div>
                    <label for="university">الجامعة</label>
                    <select id="university" required>
                        <option value="">اختر الجامعة</option>
                        <option value="جامعة الأمير سطام بن عبدالعزيز">جامعة الأمير سطام بن عبدالعزيز</option>
                        <option value="جامعة الملك سعود">جامعة الملك سعود</option>
                        <option value="جامعة الأميرة نورة بنت عبدالرحمن">جامعة الأميرة نورة بنت عبدالرحمن</option>
                        <option value="كل الجامعات">كل الجامعات</option>
                    </select>
                </div>
                <div>
                    <label for="major">التخصص</label>
                    <input type="text" id="major" placeholder="مثال: هندسة البرمجيات" required>
                </div>
                <div>
                    <label for="reg-email">البريد الإلكتروني</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>
                <div>
                    <label for="reg-password">كلمة المرور</label>
                    <input type="password" id="reg-password" placeholder="أدخل كلمة المرور" required>
                </div>
                <div>
                    <button type="submit" class="btn-submit">إنشاء حساب</button>
                </div>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        function registerUser(e) {
            e.preventDefault();
            var nameVal = document.getElementById('student-name').value.trim();
            var uniVal = document.getElementById('university').value;
            var isAll = (uniVal === 'كل الجامعات');
            var userObj = {
                name: nameVal,
                university: uniVal,
                major: document.getElementById('major').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                role: isAll ? 'leader' : 'student',
                isAllUniversities: isAll
            };
            var users = getUsers();
            users.push(userObj);
            saveUsers(users);
            setCurrentUser(userObj);
            window.location.href = 'my-groups.html';
        }
    </script>
</body>
</html>
