<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>UniLink - إنشاء حساب</title>
</head>
<body>

    <header>
        <div>
            <a href="login.html">&lt; العودة</a>
        </div>
        <div>
            <h1>UniLink</h1>
        </div>
    </header>

    <main>
        <section>
            <h2>إنشاء حساب</h2>
            <h3>مرحباً بك</h3>
            <p>أنشئ حسابك الخاص لمتابعة آخر تحديثات جامعتك</p>

            <form action="login.html" method="GET">
                <div>
                    <label for="reg-email">البريد الإلكتروني</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>

                <div>
                    <label for="reg-password">كلمة المرور</label>
                    <input type="password" id="reg-password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div>
                    <input type="checkbox" id="reg-remember">
                    <label for="reg-remember">تذكرني</label>
                </div>

                <div>
                    <button type="submit">إنشاء حساب &larr;</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
