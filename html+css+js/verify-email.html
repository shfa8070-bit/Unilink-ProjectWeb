<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>UniLink - تحقق من الحساب الجامعي</title>
</head>
<body>

    <header>
        <div>
            <a href="group-details.html">&lt; العودة</a>
        </div>
        <div>
            <h1>UniLink</h1>
        </div>
    </header>

    <main>
        <section>
            <h2>تحقق من حسابك الجامعي</h2>
            <p>أدخل بريدك الجامعي لتلقي رمز التحقق</p>

            <form onsubmit="handleVerification(event)">
                <div>
                    <label for="university-email">البريد الجامعي</label>
                    <input type="email" id="university-email" placeholder="xxxxxxxx@psau.edu.sa" required>
                </div>

                <div>
                    <button type="submit">إرسال الرمز &larr;</button>
                </div>
            </form>

            <p>نحن نحافظ على خصوصية بياناتك ولن نشاركها مع أي جهة خارجية</p>
        </section>
    </main>

    <script>
        function handleVerification(event) {
            event.preventDefault();
            alert('تم إرسال رمز التحقق بنجاح إلى بريدك الجامعي');
            window.location.href = 'group-details.html';
        }
    </script>

</body>
</html>
