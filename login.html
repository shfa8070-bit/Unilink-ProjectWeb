<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>UniLink - تسجيل الدخول</title>
</head>
<body>

    <header>
        <div>
            <a href="index.html">&lt; العودة</a>
            <a href="login.html">تسجيل الدخول</a>
        </div>
        <div>
            <h1>UniLink</h1>
        </div>
    </header>

    <main>
        <section>
            <h2>تسجيل الدخول</h2>
            <h3>مرحباً بعودتك</h3>
            <p>سجّل الدخول إلى حسابك لمتابعة آخر تحديثات جامعتك</p>

            <form action="#" method="POST">
                <div>
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div>
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div>
                    <input type="checkbox" id="remember">
                    <label for="remember">تذكرني</label>
                    &nbsp;|&nbsp;
                    <a href="forgot-password.html">نسيت كلمة المرور؟</a>
                </div>

                <div>
                    <button type="submit">تسجيل الدخول &larr;</button>
                </div>
            </form>

            <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
        </section>
    </main>

</body>
</html>
